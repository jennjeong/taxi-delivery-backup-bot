name: 원본 저장소 백업

# Runs on its own schedule, outside the source repository, so a push that
# overwrites the source (and its workflow files) cannot stop it.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "바뀐 게 없어도 텔레그램 테스트 알림 보내기"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: backup
  cancel-in-progress: false

env:
  SRC_REPO: SYU-Taxi-Delivery/taxi-delivery-sharing
  DST_REPO: ${{ github.repository }}
  SUMMARY_FILE: ${{ github.workspace }}/../backup-summary.txt

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backup-bot

      - name: 코드 백업 (덮어쓴 이전 상태는 archive/ 로 보관)
        env:
          # BACKUP_TOKEN (optional): a token that may also push commits which
          # change workflow files. Without it, GITHUB_TOKEN is used.
          TOKEN: ${{ secrets.BACKUP_TOKEN || github.token }}
        run: |
          git config --global user.name "backup-bot"
          git config --global user.email "backup-bot@users.noreply.github.com"
          export SRC_URL="https://github.com/${SRC_REPO}.git"
          export DST_URL="https://x-access-token:${TOKEN}@github.com/${DST_REPO}.git"
          bash scripts/mirror.sh

      - name: 이슈·PR 글 백업
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_issues.py

      # Telegram: only when something was backed up (or the run failed).
      # Needs secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID; skipped without them.
      - name: 텔레그램 알림
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          TEST_MESSAGE: ${{ inputs.test_message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "텔레그램 시크릿이 없어 알림을 건너뜁니다."; exit 0
          fi
          touch "$SUMMARY_FILE"
          if [ "$JOB_STATUS" != "success" ]; then
            echo "[실패] 백업 실행이 실패했어요. 기록을 확인해 주세요." >> "$SUMMARY_FILE"
          fi
          if [ "$TEST_MESSAGE" = "true" ] && ! grep -q '[^[:space:]]' "$SUMMARY_FILE"; then
            echo "테스트 알림이에요. 지금은 원본에 새로 바뀐 내용이 없어요." >> "$SUMMARY_FILE"
          fi
          if ! grep -q '[^[:space:]]' "$SUMMARY_FILE"; then
            echo "바뀐 내용이 없어 알림을 보내지 않습니다."; exit 0
          fi
          {
            echo "[백업] ${SRC_REPO}"
            echo
            grep -v '^[[:space:]]*$' "$SUMMARY_FILE"
            echo
            echo "백업: https://github.com/${DST_REPO}"
            echo "실행 기록: ${RUN_URL}"
          } | head -c 3900 | iconv -c -f UTF-8 -t UTF-8 > message.txt
          curl -sS --fail -o /dev/null -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@message.txt" \
            --data "disable_web_page_preview=true"
          echo "텔레그램 알림을 보냈어요."
