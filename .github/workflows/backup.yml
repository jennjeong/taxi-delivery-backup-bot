name: 원본 저장소 백업

# Runs in its own repository, outside both the source and the backup, so a
# push that overwrites the source cannot stop it, and the backup holds only
# the source's own branches (its default branch is the source's).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "바뀐 게 없어도 텔레그램 테스트 알림 보내기"
        type: boolean
        default: false
      check_token:
        description: "BACKUP_TOKEN 확인 (워크플로 파일을 바꾼 커밋을 임시 브랜치에 올렸다가 지움)"
        type: boolean
        default: false
      send_examples:
        description: "알림 예시(테스트 저장소 시나리오)를 텔레그램으로 보내기"
        type: boolean
        default: false

permissions:
  contents: read

env:
  WORK_DIR: ${{ github.workspace }}/../mirror.git
  TRANSITIONS_FILE: ${{ github.workspace }}/../transitions.tsv
  ISSUES_SUMMARY_FILE: ${{ github.workspace }}/../issues-summary.txt

jobs:
  backup:
    name: 백업 (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One job per source repository; a failure in one never stops the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 백엔드
            src: SYU-Taxi-Delivery/taxi-delivery-sharing
            dst: jennjeong/taxi-delivery-sharing
          - label: 프론트
            src: SYU-Taxi-Delivery/taxi-delivery-sharing-fe
            dst: jennjeong/taxi-delivery-sharing-fe
    concurrency:
      group: backup-${{ matrix.dst }}
      cancel-in-progress: false
    env:
      SRC_REPO: ${{ matrix.src }}
      DST_REPO: ${{ matrix.dst }}
      REPO_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      # BACKUP_TOKEN: fine-grained token for the backup repositories only, with
      # Contents, Workflows and Issues set to read and write.
      - name: 토큰 확인
        env:
          TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: '[ -n "$TOKEN" ] || { echo "BACKUP_TOKEN 시크릿이 없어요."; exit 1; }'

      - name: 시각 기록
        run: echo "STAMP=$(date -u +%Y%m%dT%H%MZ)" >> "$GITHUB_ENV"

      # Before hiding any backed-up state (force push, deleted files, deleted
      # branch) it is kept as archive/... and verified; otherwise that ref is
      # held as it was and this step fails.
      - name: BACKUP_TOKEN 확인
        if: ${{ inputs.check_token }}
        env:
          TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "BACKUP_TOKEN 시크릿이 없어요."; exit 1; }
          d="$(mktemp -d)"; cd "$d"; git init -q
          git fetch -q --depth 1 "https://github.com/${SRC_REPO}.git" main
          git checkout -q FETCH_HEAD
          f="$(ls .github/workflows/* | head -1)"
          echo "# token check" >> "$f"
          git -c user.name=backup-bot -c user.email=backup-bot@users.noreply.github.com commit -qam "token check"
          url="https://x-access-token:${TOKEN}@github.com/${DST_REPO}.git"
          ref="refs/heads/token-check/${GITHUB_RUN_ID}"
          git push -q "$url" "HEAD:$ref"
          git push -q "$url" ":$ref"
          echo "BACKUP_TOKEN으로 워크플로 파일($f)을 바꾼 커밋을 올리고 지웠어요."

      - name: 코드 백업 (이전 버전 보관 후 최신 상태 반영)
        id: mirror
        env:
          TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          git config --global user.name "backup-bot"
          git config --global user.email "backup-bot@users.noreply.github.com"
          export SRC_URL="https://github.com/${SRC_REPO}.git"
          export DST_URL="https://x-access-token:${TOKEN}@github.com/${DST_REPO}.git"
          bash scripts/mirror.sh

      - name: 이슈·PR 글 백업
        id: issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          SRC_TOKEN: ${{ github.token }}
          SUMMARY_FILE: ${{ env.ISSUES_SUMMARY_FILE }}
        run: python3 scripts/sync_issues.py

      # One message per source push. Needs TELEGRAM_BOT_TOKEN and
      # TELEGRAM_CHAT_ID; without them the messages are only printed.
      - name: 텔레그램 알림
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ secrets.BACKUP_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIRROR_OUTCOME: ${{ steps.mirror.outcome }}
          ISSUES_OUTCOME: ${{ steps.issues.outcome }}
          TEST_MESSAGE: ${{ inputs.test_message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export SRC_URL="https://github.com/${SRC_REPO}.git"
          export DST_URL="https://x-access-token:${TOKEN}@github.com/${DST_REPO}.git"
          python3 scripts/report.py

      - name: 알림 예시 보내기
        if: ${{ inputs.send_examples && matrix.label == '백엔드' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config --global init.defaultBranch main
          SEND=1 python3 tests/scenarios.py
